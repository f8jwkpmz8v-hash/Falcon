<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Personal Money Dashboard</title>
<style>
:root{--bg:#f5f7f8;--card:#fff;--text:#17202a;--muted:#6b7280;--line:#e5e7eb;--accent:#245b4a;--accent2:#dceee7;--danger:#b42318;--warn:#9a6700;--shadow:0 8px 28px rgba(20,30,35,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:230px;background:#14241f;color:#fff;padding:24px 14px;position:fixed;inset:0 auto 0 0}.brand{font-size:21px;font-weight:800;padding:0 12px 25px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#cbd8d3;padding:11px 12px;border-radius:9px;margin:3px 0}.nav button.active,.nav button:hover{background:#234238;color:#fff}.main{margin-left:230px;width:calc(100% - 230px);padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:28px}.date{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.metric{font-size:28px;font-weight:750;margin-top:5px}.label{color:var(--muted);font-size:13px}.section{margin-top:18px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-title h2{font-size:18px;margin:0}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.pill{font-size:12px;padding:4px 8px;border-radius:999px;background:var(--accent2);color:var(--accent)}.danger{color:var(--danger)}.positive{color:var(--accent)}.bar{height:9px;background:#edf0f1;border-radius:9px;overflow:hidden;margin-top:7px}.bar>span{display:block;height:100%;background:var(--accent);border-radius:9px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}.table th{font-size:12px;color:var(--muted);font-weight:600}.right{text-align:right!important}.modal{position:fixed;inset:0;background:rgba(10,18,15,.4);display:none;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;width:min(520px,100%);border-radius:16px;padding:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field input,.field select{border:1px solid #d7dce0;border-radius:8px;padding:10px;background:#fff}.empty{padding:28px;text-align:center;color:var(--muted)}.small{font-size:12px;color:var(--muted)}@media(max-width:900px){.sidebar{width:72px}.brand{font-size:0}.brand:after{content:"$";font-size:25px}.nav button{font-size:0;text-align:center}.nav button:before{font-size:19px}.nav button[data-page="dashboard"]:before{content:"⌂"}.nav button[data-page="budget"]:before{content:"▦"}.nav button[data-page="transactions"]:before{content:"↔"}.nav button[data-page="bills"]:before{content:"◷"}.nav button[data-page="accounts"]:before{content:"◉"}.nav button[data-page="goals"]:before{content:"◎"}.nav button[data-page="investments"]:before{content:"↗"}.main{margin-left:72px;width:calc(100% - 72px);padding:18px}.grid{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}@media(max-width:600px){.grid,.formgrid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.top h1{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand">My Money</div><nav class="nav">
<button class="active" data-page="dashboard">Dashboard</button><button data-page="budget">Budget</button><button data-page="transactions">Transactions</button><button data-page="bills">Bills</button><button data-page="accounts">Accounts</button><button data-page="goals">Goals</button><button data-page="investments">Investments</button>
</nav><div style="position:absolute;bottom:20px;padding:12px;font-size:11px;color:#8fa39b">Private • local only<br>Data stays in this browser</div></aside>
<main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="date" id="subtitle"></div></div><div class="actions"><button class="btn" onclick="exportData()">Export</button><button class="btn" onclick="openImport()">Import</button><button class="btn primary" onclick="quickAdd()">+ Add</button></div></div><div id="content"></div></main>
</div>

<div class="modal" id="modal"><div class="modalbox"><div class="section-title"><h2 id="modalTitle">Add</h2><button class="btn" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<input id="fileImport" type="file" accept=".json" style="display:none">

<script>
const KEY="personalMoney_v1";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
 accounts:[
  {id:1,name:"Checking",type:"Checking",balance:0},
  {id:2,name:"HYSA",type:"Savings",balance:0},
  {id:3,name:"Roth IRA",type:"Investment",balance:0},
  {id:4,name:"401(k)",type:"Investment",balance:0}
 ],
 categories:[
  ["Housing",2300],["Student Loans",1518],["Transportation",425],["Groceries",600],["Dining",300],["Utilities",250],["Travel",250],["Fitness",100],["Entertainment",150],["Investing",1000],["Miscellaneous",200]
 ],
 transactions:[], bills:[], goals:[], investments:[], income:0
};
let page="dashboard";
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function money(n){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n)||0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function today(){return new Date().toISOString().slice(0,10)}
function totalCash(){return state.accounts.filter(a=>a.type!=="Investment").reduce((s,a)=>s+Number(a.balance||0),0)}
function totalInvest(){return state.accounts.filter(a=>a.type==="Investment").reduce((s,a)=>s+Number(a.balance||0),0)}
function netWorth(){return state.accounts.reduce((s,a)=>s+Number(a.balance||0),0)}
function monthTx(){let m=today().slice(0,7);return state.transactions.filter(t=>String(t.date).slice(0,7)===m)}
function spending(){return monthTx().filter(t=>t.amount>0).reduce((s,t)=>s+Number(t.amount),0)}
function income(){return monthTx().filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(Number(t.amount)),0)}
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("title").textContent=page[0].toUpperCase()+page.slice(1);document.getElementById("subtitle").textContent=new Date().toLocaleDateString("en-US",{month:"long",year:"numeric"});document.getElementById("content").innerHTML=pages[page]()}
const pages={
dashboard(){let cats=state.categories.map(([n,b])=>{let spent=monthTx().filter(t=>t.category===n&&t.amount>0).reduce((s,t)=>s+t.amount,0);return {n,b,spent}});return `<div class="grid">
<div class="card"><div class="label">Net worth</div><div class="metric">${money(netWorth())}</div></div>
<div class="card"><div class="label">Cash</div><div class="metric">${money(totalCash())}</div></div>
<div class="card"><div class="label">Investments</div><div class="metric">${money(totalInvest())}</div></div>
<div class="card"><div class="label">Spent this month</div><div class="metric">${money(spending())}</div></div></div>
<div class="two section"><div class="card"><div class="section-title"><h2>Monthly budget</h2><span class="pill">${money(state.categories.reduce((s,c)=>s+c[1],0))} planned</span></div>${cats.map(c=>`<div class="row"><div style="width:70%"><b>${esc(c.n)}</b><div class="small">${money(c.spent)} of ${money(c.b)} used</div><div class="bar"><span style="width:${Math.min(100,c.b?c.spent/c.b*100:0)}%"></span></div></div><b>${money(Math.max(0,c.b-c.spent))}</b></div>`).join("")}</div>
<div class="card"><div class="section-title"><h2>Recent activity</h2><button class="btn" onclick="page='transactions';render()">View all</button></div>${monthTx().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(t=>`<div class="row"><div><b>${esc(t.payee)}</b><div class="small">${esc(t.category)} • ${esc(t.date)}</div></div><b class="${t.amount<0?'positive':'danger'}">${t.amount<0?'+':''}${money(Math.abs(t.amount))}</b></div>`).join("")||'<div class="empty">No transactions yet.</div>'}</div></div>`},
budget(){return `<div class="card"><div class="section-title"><h2>Budget categories</h2><button class="btn primary" onclick="addCategory()">+ Category</button></div><table class="table"><thead><tr><th>Category</th><th>Budget</th><th>Spent</th><th>Remaining</th></tr></thead><tbody>${state.categories.map((c,i)=>{let s=monthTx().filter(t=>t.category===c[0]&&t.amount>0).reduce((x,t)=>x+t.amount,0);return `<tr><td><b>${esc(c[0])}</b></td><td>${money(c[1])}</td><td>${money(s)}</td><td class="${c[1]-s<0?'danger':'positive'}">${money(c[1]-s)}</td></tr>`}).join("")}</tbody></table></div>`},
transactions(){return `<div class="card"><div class="section-title"><h2>Transactions</h2><button class="btn primary" onclick="addTransaction()">+ Transaction</button></div>${state.transactions.length?`<table class="table"><thead><tr><th>Date</th><th>Payee</th><th>Category</th><th>Account</th><th class="right">Amount</th></tr></thead><tbody>${state.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.payee)}</td><td>${esc(t.category)}</td><td>${esc((state.accounts.find(a=>a.id==t.accountId)||{}).name||"—")}</td><td class="right ${t.amount<0?'positive':'danger'}">${t.amount<0?'+':''}${money(Math.abs(t.amount))}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">No transactions. Add your first one.</div>'}</div>`},
bills(){return `<div class="card"><div class="section-title"><h2>Bills & recurring expenses</h2><button class="btn primary" onclick="addBill()">+ Bill</button></div>${state.bills.length?state.bills.map(b=>`<div class="row"><div><b>${esc(b.name)}</b><div class="small">Due ${esc(b.due)} • ${esc(b.frequency||"Monthly")}</div></div><b>${money(b.amount)}</b></div>`).join(""):'<div class="empty">Track rent, loans, subscriptions and other recurring bills here.</div>'}</div>`},
accounts(){return `<div class="grid">${state.accounts.map(a=>`<div class="card"><div class="label">${esc(a.type)}</div><div class="section-title"><h2>${esc(a.name)}</h2></div><div class="metric">${money(a.balance)}</div></div>`).join("")}</div><div class="section card"><div class="section-title"><h2>Accounts</h2><button class="btn primary" onclick="addAccount()">+ Account</button></div><table class="table"><tbody>${state.accounts.map(a=>`<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.type)}</td><td class="right">${money(a.balance)}</td></tr>`).join("")}</tbody></table></div>`},
goals(){return `<div class="grid">${state.goals.map(g=>`<div class="card"><div class="label">${esc(g.targetDate||"No date")}</div><h2>${esc(g.name)}</h2><div class="metric">${money(g.current)}</div><div class="small">of ${money(g.target)}</div><div class="bar"><span style="width:${Math.min(100,g.target?g.current/g.target*100:0)}%"></span></div></div>`).join("")}</div><div class="section card"><div class="section-title"><h2>Savings goals</h2><button class="btn primary" onclick="addGoal()">+ Goal</button></div>${state.goals.length?'': '<div class="empty">Create goals for travel, emergency savings, a vehicle, or anything else.</div>'}</div>`},
investments(){return `<div class="grid"><div class="card"><div class="label">Investment accounts</div><div class="metric">${money(totalInvest())}</div></div><div class="card"><div class="label">Tracked holdings</div><div class="metric">${state.investments.length}</div></div></div><div class="section card"><div class="section-title"><h2>Holdings</h2><button class="btn primary" onclick="addInvestment()">+ Holding</button></div>${state.investments.length?`<table class="table"><thead><tr><th>Ticker</th><th>Account</th><th>Shares</th><th>Value</th></tr></thead><tbody>${state.investments.map(i=>`<tr><td><b>${esc(i.ticker)}</b></td><td>${esc(i.account)}</td><td>${i.shares}</td><td>${money(i.value)}</td></tr>`).join("")}</tbody></table>`:'<div class="empty">Track VOO, NVDA, AMAT, V, COST and other holdings manually. No market data connection is required.</div>'}</div>`}
};
function modal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function quickAdd(){modal("Quick add",`<div class="actions"><button class="btn primary" onclick="closeModal();addTransaction()">Transaction</button><button class="btn" onclick="closeModal();addBill()">Bill</button><button class="btn" onclick="closeModal();addGoal()">Goal</button><button class="btn" onclick="closeModal();addAccount()">Account</button></div>`)}
function addCategory(){modal("New category",`<div class="formgrid"><div class="field"><label>Name</label><input id="f1"></div><div class="field"><label>Monthly budget</label><input id="f2" type="number"></div></div><br><button class="btn primary" onclick="state.categories.push([f1.value,Number(f2.value)||0]);save();closeModal();render()">Save</button>`)}
function addTransaction(){let opts=state.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join(""), cats=state.categories.map(c=>`<option>${esc(c[0])}</option>`).join("");modal("Add transaction",`<div class="formgrid"><div class="field"><label>Date</label><input id="f1" type="date" value="${today()}"></div><div class="field"><label>Payee</label><input id="f2" placeholder="e.g. Costco"></div><div class="field"><label>Category</label><select id="f3">${cats}</select></div><div class="field"><label>Account</label><select id="f4">${opts}</select></div><div class="field full"><label>Amount <span class="small">Use positive for spending, negative for income.</span></label><input id="f5" type="number" step=".01"></div></div><br><button class="btn primary" onclick="let a=Number(f5.value)||0;state.transactions.push({date:f1.value,payee:f2.value,category:f3.value,accountId:Number(f4.value),amount:a});let ac=state.accounts.find(x=>x.id==Number(f4.value));if(ac)ac.balance-=a;save();closeModal();render()">Save transaction</button>`)}
function addBill(){modal("Add bill",`<div class="formgrid"><div class="field"><label>Name</label><input id="f1" placeholder="Rent"></div><div class="field"><label>Amount</label><input id="f2" type="number" step=".01"></div><div class="field"><label>Due day</label><input id="f3" type="number" min="1" max="31"></div><div class="field"><label>Frequency</label><select id="f4"><option>Monthly</option><option>Biweekly</option><option>Annual</option></select></div></div><br><button class="btn primary" onclick="state.bills.push({name:f1.value,amount:Number(f2.value)||0,due:f3.value,frequency:f4.value});save();closeModal();render()">Save bill</button>`)}
function addAccount(){modal("Add account",`<div class="formgrid"><div class="field"><label>Name</label><input id="f1" placeholder="Credit Card"></div><div class="field"><label>Type</label><select id="f2"><option>Checking</option><option>Savings</option><option>Credit Card</option><option>Investment</option><option>Cash</option><option>Loan</option></select></div><div class="field full"><label>Current balance</label><input id="f3" type="number" step=".01"></div></div><br><button class="btn primary" onclick="state.accounts.push({id:Date.now(),name:f1.value,type:f2.value,balance:Number(f3.value)||0});save();closeModal();render()">Save account</button>`)}
function addGoal(){modal("Savings goal",`<div class="formgrid"><div class="field"><label>Goal</label><input id="f1" placeholder="Emergency fund"></div><div class="field"><label>Target</label><input id="f2" type="number"></div><div class="field"><label>Current</label><input id="f3" type="number"></div><div class="field"><label>Target date</label><input id="f4" type="date"></div></div><br><button class="btn primary" onclick="state.goals.push({name:f1.value,target:Number(f2.value)||0,current:Number(f3.value)||0,targetDate:f4.value});save();closeModal();render()">Save goal</button>`)}
function addInvestment(){modal("Add holding",`<div class="formgrid"><div class="field"><label>Ticker</label><input id="f1" placeholder="VOO"></div><div class="field"><label>Account</label><input id="f2" placeholder="Roth IRA"></div><div class="field"><label>Shares</label><input id="f3" type="number" step=".001"></div><div class="field"><label>Current value</label><input id="f4" type="number"></div></div><br><button class="btn primary" onclick="state.investments.push({ticker:f1.value,account:f2.value,shares:Number(f3.value)||0,value:Number(f4.value)||0});save();closeModal();render()">Save holding</button>`)}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="my-money-backup.json";a.click();URL.revokeObjectURL(a.href)}
function openImport(){document.getElementById("fileImport").click()}
document.getElementById("fileImport").addEventListener("change",e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render()}catch{alert("Invalid backup file.")}};r.readAsText(f)})
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
render();
</script>
</body></html>
